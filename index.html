<!DOCTYPE html> <html lang="ar" dir="rtl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1"> <title>Art Background</title> <style> * { box-sizing: border-box; } html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #e8dcc5; } canvas { position: fixed; inset: 0; } .scene { position: relative; width: 100vw; height: 100vh; overflow: hidden; background: radial-gradient(circle at 50% 35%, #f5eddd 0 18%, transparent 50%), #e8dcc5; } /* الشخصية */ .figure { position: absolute; width: min(72vw, 520px); height: 92vh; left: 50%; bottom: -5vh; transform: translateX(-50%); } /* ظلال خلف الشخصية */ .halo { position: absolute; width: 75%; height: 75%; left: 12%; top: 12%; border-radius: 50%; background: rgba(0,0,0,.06); filter: blur(20px); } /* SVG */ svg { width: 100%; height: 100%; overflow: visible; } /* حركة بسيطة */ .body { transform-origin: 50% 90%; animation: breathe 5s ease-in-out infinite; } @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.008, .995); } } /* زخارف الخلفية */ .shape { position: absolute; border: 3px solid #111; border-radius: 50%; opacity: .15; } .s1 { width: 25vw; height: 25vw; left: -8vw; top: 12vh; } .s2 { width: 18vw; height: 18vw; right: -4vw; bottom: 15vh; } .s3 { width: 9vw; height: 9vw; right: 14vw; top: 8vh; } </style> </head> <body> <div class="scene"> <div class="shape s1"></div> <div class="shape s2"></div> <div class="shape s3"></div> <div class="figure"> <div class="halo"></div> <svg viewBox="0 0 500 900" xmlns="http://www.w3.org/2000/svg"> <g class="body"> <!-- الرأس --> <ellipse cx="250" cy="105" rx="62" ry="75" fill="#111"/> <!-- الشعر --> <path d="M185 115 C160 35 215 15 265 25 C335 38 340 110 310 155 C295 125 278 105 250 90 C225 105 205 130 190 165 C175 150 168 130 185 115Z" fill="#111"/> <!-- الرقبة --> <path d="M220 160 L280 160 L292 235 L208 235 Z" fill="#111"/> <!-- الجسم العام --> <path d=" M208 205 C180 230 166 275 158 330 C150
