name: build-uploader-apk

on:
  push:
    branches: [android-uploader]
    paths:
      - 'android-uploader/**'
      - '.github/workflows/build-uploader-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-uploader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.7'
      - run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: dafit-uploader-apk
          path: android-uploader/app/build/outputs/apk/debug/app-debug.apk
